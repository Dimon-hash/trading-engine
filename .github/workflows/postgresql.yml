name: PostgreSQL CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration-test:
    name: PostgreSQL 16 integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trading_engine_test
          POSTGRES_USER: trading_ci
          POSTGRES_PASSWORD: trading_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U trading_ci -d trading_engine_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run trading integration tests
        env:
          TRADING_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports['5432'] }}/trading_engine_test
          TRADING_TEST_POSTGRES_USER: trading_ci
          TRADING_TEST_POSTGRES_PASSWORD: trading_ci
        run: mvn -B -Dtest=TradingPersistenceTest -Dgroups=postgresql -Dtrading.test.postgres=true test
