services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: trading_engine
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${TRADING_DB_PASSWORD:-trading}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_engine"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
